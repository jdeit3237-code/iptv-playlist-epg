name: Update Florida Keys Live Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: gh-pages
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Generate Florida Keys Feeds
      run: |
        python3 << 'PYTHON_EOF'
        import concurrent.futures
        import urllib.request
        import urllib.error
        import ssl
        import json
        from xml.sax.saxutils import escape
        from datetime import datetime, timedelta
        
        ssl_context = ssl.create_default_context()
        ssl_context.check_hostname = False
        ssl_context.verify_mode = ssl.CERT_NONE
        
        FLORIDA_KEYS_FEEDS = [
            {"name": "Dolphins Cam", "url": "https://b15.hdrelay.com/camera/CID_WMAA00000062/relay/playlist.m3u8", "location": "Clearwater, Florida", "category": "Live HLS"},
            {"name": "Clearwater Marine Aquarium Dolphin Cam", "url": "https://use01-smr04-relay.ozolio.com/hls-live/_definst_/relay01.zemocxr.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/playlist.m3u8", "location": "Clearwater, Florida", "category": "Live HLS"},
            {"name": "Georgia Aquarium Moon Jelly Cam", "url": "https://usw01-smr04-relay.ozolio.com/hll-live/_definst_/relay01.bktacf0.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/playlist.m3u8", "location": "Atlanta, Georgia", "category": "Live HLS"},
            {"name": "Scripps Kelp Cam", "url": "https://live.hdontap.com/hls/hosb3/scripps_kelp_cam-ptz.stream/playlist.m3u8?t=xlB2wdq0SPN6QT2Vowm_4A&e=1784359109", "location": "Pacific", "category": "Live HLS"},
            {"name": "Biscayne Bay Cam", "url": "https://s32.ipcamlive.com/streams/20cow684nfjkuigqh/stream.m3u8", "location": "Biscayne Bay", "category": "Live HLS"},
            {"name": "Galleon Marina Cam", "url": "https://use01-smr03-relay.ozolio.com/hls-live/_definst_/relay01.jqtbdm2.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/playlist.m3u8", "location": "Key West", "category": "Live HLS"},
            {"name": "Cedar Key Florida Cam", "url": "https://s47.ipcamlive.com/streams/2fjpxvtzfulkouqx9/stream.m3u8", "location": "Cedar Key", "category": "Live HLS"},
            {"name": "Southernmost Beach Resort Pineapple Pool", "url": "https://usw01-smr04-relay.ozolio.com/hls-live/_definst_/relay01.ytzidtu.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/playlist.m3u8", "location": "Key West", "category": "Live HLS"},
            {"name": "Key West Butterfly Conservatory", "url": "https://usw01-smr03-relay.ozolio.com/hls-live/_definst_/relay01.pkhjdls.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/playlist.m3u8", "location": "Key West", "category": "Live HLS"},
            {"name": "Reach Key West Cam", "url": "https://reachkeywestccn.cdn.coastalcameranetwork.com/Florida/reachkeywest.stream/chunklist.m3u8", "location": "Key West", "category": "Live HLS"},
            {"name": "Mallory Square", "url": "https://usw01-smr04-relay.ozolio.com/hls-live/_definst_/relay01.kfzxdyu.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/chunklist_w698531836.m3u8", "location": "Key West", "category": "Live HLS"},
            {"name": "Georgia Aquarium Whale Shark Cam", "url": "https://usw01-smr04-relay.ozolio.com/hls-live/_definst_/relay01.hqko7z.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/playlist.m3u8", "location": "Atlanta, Georgia", "category": "Live HLS"},
            {"name": "Dallas World Aquarium Manatee Cam", "url": "https://s79.ipcamlive.com/streams/4fugvwxob4nehvfeg/stream.m3u8", "location": "Dallas, Texas", "category": "Live HLS"},
            {"name": "Dallas World Aquarium Underwater Rainforest Cam", "url": "https://s97.ipcamlive.com/streams/61rmzee8igswgtjar/stream.m3u8", "location": "Dallas, Texas", "category": "Live HLS"},
            {"name": "Southernmost Point", "url": "https://use01-smr03-relay.ozolio.com/hls-live/_definst_/relay01.zbprdoz.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt20687.rc0.edge.basic.stream/playlist.m3u8", "location": "Key West", "category": "Live HLS"},
            {"name": "Explore Live Cam 10", "url": "https://outbound-production.explore.org/stream-production-10/.m3u8", "location": "Explore.org", "category": "Live HLS"},
            {"name": "Top-of-Wall Underwater Reef Cam", "url": "https://outbound-production.explore.org/stream-production-565/.m3u8", "location": "Utopia Village, Utila, Bay Islands, Honduras", "category": "Live HLS"},
            {"name": "Sandy Channel Underwater Reef Cam", "url": "https://outbound-production.explore.org/stream-production-720/.m3u8", "location": "Utopia Village, Utila, Bay Islands, Honduras", "category": "Live HLS"},
            {"name": "Homosassa Springs Underwater Manatees", "url": "https://outbound-production.explore.org/stream-production-319/.m3u8", "location": "Ellie Schiller Homosassa Springs Wildlife State Park, Florida, USA", "category": "Live HLS"},
            {"name": "Silver Springs Above Water Manatee Camera", "url": "https://outbound-production.explore.org/stream-production-761/.m3u8", "location": "Silver Springs, Florida", "category": "Live HLS"},
            {"name": "Shark Lagoon", "url": "https://outbound-production.explore.org/stream-production-12/.m3u8", "location": "Long Beach, California, USA", "category": "Live HLS"},
            {"name": "Back-of-Dock Underwater Reef Cams", "url": "https://outbound-production.explore.org/stream-production-655/.m3u8", "location": "Utopia Village, Utila, Bay Islands, Honduras", "category": "Live HLS"},
            {"name": "Edge-of-Wall Underwater Reef Cam", "url": "https://outbound-production.explore.org/stream-production-767/.m3u8", "location": "Utopia Village, Utila, Bay Islands, Honduras", "category": "Live HLS"},
        ]
        
        def validate_feed(feed_info, timeout=8):
            try:
                req = urllib.request.Request(feed_info['url'], method='HEAD')
                req.add_header('User-Agent', 'Mozilla/5.0')
                with urllib.request.urlopen(req, timeout=timeout, context=ssl_context) as response:
                    feed_info['valid'] = response.status in [200, 206]
                    return feed_info
            except:
                feed_info['valid'] = False
                return feed_info
        
        print("Validating Florida Keys feeds...")
        with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
            results = list(executor.map(validate_feed, FLORIDA_KEYS_FEEDS))
        
        valid_count = sum(1 for f in results if f.get('valid'))
        print(f"Valid feeds: {valid_count}/{len(results)}")
        
        with open('florida_keys_live.m3u', 'w') as f:
            f.write('#EXTM3U\n')
            for i, feed in enumerate(results, 1):
                tvg_id = f"fk_{i:02d}"
                f.write(f'#EXTINF:-1,{feed["name"]}\n')
                f.write(f'{feed["url"]}\n')
        
        now = datetime.utcnow()
        with open('florida_keys_live.xml', 'w') as f:
            f.write('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE tv SYSTEM "xmltv.dtd">\n<tv>\n')
            for i, feed in enumerate(results, 1):
                tvg_id = f"fk_{i:02d}"
                name = escape(feed["name"])
                location = escape(feed["location"])
                url = escape(feed["url"])
                f.write(f'  <channel id="{tvg_id}"><display-name>{name}</display-name><desc>Location: {location}</desc><url>{url}</url></channel>\n')
            for i, feed in enumerate(results, 1):
                tvg_id = f"fk_{i:02d}"
                start = now.strftime("%Y%m%d%H%M%S +0000")
                end = (now + timedelta(hours=6)).strftime("%Y%m%d%H%M%S +0000")
                name = escape(feed["name"])
                location = escape(feed["location"])
                f.write(f'  <programme start="{start}" stop="{end}" channel="{tvg_id}"><title>{name}</title><desc>Location: {location}</desc></programme>\n')
            f.write('</tv>\n')
        
        with open('florida_keys_provider.json', 'w') as f:
            json.dump({"provider": {"name": "Florida Keys Live", "feeds": valid_count}}, f)
        
        print("Done")
        PYTHON_EOF
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add florida_keys_live.m3u florida_keys_live.xml florida_keys_provider.json
        git commit -m "Update Florida Keys feeds $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
        git push origin gh-pages || echo "Push skipped"
