name: Update Florida Keys Live Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: gh-pages
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Generate Florida Keys Feeds
      run: |
        python3 << 'PYTHON_EOF'
        import concurrent.futures
        import urllib.request
        import urllib.error
        import ssl
        import json
        from datetime import datetime, timedelta
        
        ssl_context = ssl.create_default_context()
        ssl_context.check_hostname = False
        ssl_context.verify_mode = ssl.CERT_NONE
        
        FLORIDA_KEYS_FEEDS = [
            {"name": "Marathon Key Scenic View", "url": "https://www.marathonfl.com/", "location": "Marathon", "category": "Scenic"},
            {"name": "Islamorada Keys Waterfront", "url": "https://www.islamoradafl.com/", "location": "Islamorada", "category": "Waterfront"},
            {"name": "Dry Tortugas National Park", "url": "https://www.nps.gov/drto/", "location": "Dry Tortugas", "category": "National Park"},
            {"name": "Key West Marina Live Feed", "url": "https://www.keywestmarina.com/", "location": "Key West", "category": "Marina"},
            {"name": "Key West National Weather Service", "url": "https://www.weather.gov/tbw/", "location": "Key West", "category": "Weather"},
            {"name": "Florida Keys Marine Monitoring", "url": "https://www.fisheries.noaa.gov/", "location": "Throughout Keys", "category": "Marine"},
            {"name": "Marathon Resort Waterfront", "url": "https://www.marathonresort.com/", "location": "Marathon", "category": "Beach"},
            {"name": "Islamorada Beach Resort Cam", "url": "https://www.islamoradaresort.com/", "location": "Islamorada", "category": "Beach"},
            {"name": "Key West Aquarium Live", "url": "https://www.keywestaquarium.com/", "location": "Key West", "category": "Aquarium"},
            {"name": "Key West Historic Seaport", "url": "https://www.keywestseaport.com/", "location": "Key West", "category": "Seaport"},
            {"name": "Florida Keys Webcams", "url": "https://www.youtube.com/@FloridaKeysWebcams/live", "location": "Throughout Keys", "category": "YouTube Live"},
            {"name": "Seek Florida Keys", "url": "https://www.youtube.com/@SeekFloridaKeys/live", "location": "Throughout Keys", "category": "YouTube Live"},
        ]
        
        def validate_feed(feed_info, timeout=8):
            try:
                req = urllib.request.Request(feed_info['url'], method='HEAD')
                req.add_header('User-Agent', 'Mozilla/5.0')
                with urllib.request.urlopen(req, timeout=timeout, context=ssl_context) as response:
                    feed_info['valid'] = response.status in [200, 206]
                    return feed_info
            except:
                feed_info['valid'] = False
                return feed_info
        
        print("Validating Florida Keys feeds...")
        with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:
            results = list(executor.map(validate_feed, FLORIDA_KEYS_FEEDS))
        
        valid_count = sum(1 for f in results if f.get('valid'))
        print(f"Valid feeds: {valid_count}/{len(results)}")
        
        with open('florida_keys_live.m3u', 'w') as f:
            f.write('#EXTM3U x-tvg-url="https://jdeit3237-code.github.io/iptv-playlist-epg/florida_keys_live.xml"\n')
            for i, feed in enumerate(results, 1):
                tvg_id = f"fk_{i:02d}"
                f.write(f'#EXTINF:-1 tvg-id="{tvg_id}" tvg-name="{feed["name"]}" group-title="{feed["category"]}"\n')
                f.write(f'{feed["url"]}\n')
        
        now = datetime.utcnow()
        with open('florida_keys_live.xml', 'w') as f:
            f.write('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE tv SYSTEM "xmltv.dtd">\n<tv>\n')
            for i, feed in enumerate(results, 1):
                tvg_id = f"fk_{i:02d}"
                f.write(f'  <channel id="{tvg_id}"><display-name>{feed["name"]}</display-name></channel>\n')
            for i, feed in enumerate(results, 1):
                tvg_id = f"fk_{i:02d}"
                start = now.strftime("%Y%m%d%H%M%S +0000")
                end = (now + timedelta(hours=6)).strftime("%Y%m%d%H%M%S +0000")
                f.write(f'  <programme start="{start}" stop="{end}" channel="{tvg_id}"><title>{feed["name"]}</title></programme>\n')
            f.write('</tv>\n')
        
        with open('florida_keys_provider.json', 'w') as f:
            json.dump({"provider": {"name": "Florida Keys Live", "feeds": valid_count}}, f)
        
        print("Done")
        PYTHON_EOF
    
    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add florida_keys_live.m3u florida_keys_live.xml florida_keys_provider.json
        git commit -m "Update Florida Keys feeds $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
        git push origin gh-pages || echo "Push skipped"
